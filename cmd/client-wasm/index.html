<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrowserQuest Go Client</title>
  <style>
    html, body { margin: 0; padding: 0; background: #151b24; color: #fff; font-family: sans-serif; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <script src="wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("client-wasm.wasm"), go.importObject).then((result) => {
      go.run(result.instance);
    });
  </script>
</body>
</html>
